global:
  scrape_interval: 15s
  external_labels:
    site: kaiser

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # In-network targets are reachable by their compose service name (cn-observability default network).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  # node-exporter runs `network_mode: host` so it's reachable from inside the
  # bridge via the host-gateway address. compose adds the alias automatically
  # when we set extra_hosts: ["host.docker.internal:host-gateway"].
  - job_name: node-exporter
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels:
          host: kaiser

  # neptune.lan host metrics — cn-authentik runs here (see homelab/CLAUDE.md §3).
  - job_name: neptune-node
    static_configs:
      - targets: ["10.1.1.92:9100"]
        labels:
          host: neptune

  # Blackbox HTTPS probes — every LAN endpoint that should be reachable from
  # kaiser's network position. probe_ssl_earliest_cert_expiry on these targets
  # is what feeds CertExpired in alerts.yml.
  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module: [lan_https]
    scrape_interval: 60s
    static_configs:
      - targets:
          # cn-vaultwarden + cn-ha-sidecar + cn-pki LAN ingresses
          - https://passwords.lan
          - https://homeiot.lan
          - https://pki.lan
          # cn-mzfxa + cn-mzsync on neptune.lan
          - https://accounts.fxa.neptune.lan
          - https://api.fxa.neptune.lan
          - https://oauth.fxa.neptune.lan
          - https://profile.fxa.neptune.lan
          - https://sync.neptune.lan
          # step-ca's own ACME directory — separate cert (CN=Step Online CA),
          # exercises the same chain a Traefik client uses to renew.
          - https://pki.lan:9000/acme/acme/directory
          # *.kaiser.lan — every service behind cn-home's traefik-lan
          - https://home.kaiser.lan
          - https://grafana.kaiser.lan
          - https://prometheus.kaiser.lan
          - https://alertmanager.kaiser.lan
          - https://loki.kaiser.lan
          - https://portainer.kaiser.lan
          - https://raidnas.kaiser.lan
          - https://torrent.kaiser.lan
          - https://sonarr.kaiser.lan
          - https://radarr.kaiser.lan
          - https://prowlarr.kaiser.lan
          - https://lidarr.kaiser.lan
          - https://readarr.kaiser.lan
          - https://jellyfin.kaiser.lan
          - https://roms.kaiser.lan
          - https://fitness.kaiser.lan
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Blackbox HTTP probes — plain-HTTP endpoints.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [lan_http]
    scrape_interval: 60s
    static_configs:
      - targets:
          # step-ca CA bootstrap URL (the one used to install trust in iOS etc).
          - http://pki.lan/cert/ca.crt
          # k3s LAN ingresses (plain HTTP — TLS lives on the tailnet side).
          - http://longhorn.k8s.lan
          - http://cluster.k8s.lan
          - http://filemanager.k8s.lan
          - http://freshrss.k8s.lan
          - http://netbox.k8s.lan
          - http://hello.k8s.lan
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # passwords.lan (cn-vaultwarden) host metrics via the dual-exporter pattern:
  # cn-vaultwarden ships a SECOND node-exporter (node-exporter-lan) bound to
  # the host netns so kaiser can reach it independently of the tailnet path.
  # The tailnet-side node-exporter (inside ts-vault) keeps reporting to the
  # VPS Prometheus separately. UFW on passwords.lan must allow 9100 from
  # kaiser (10.1.1.140).
  - job_name: passwords-node
    scrape_interval: 30s
    static_configs:
      - targets: ["10.120.22.10:9100"]
        labels:
          host: passwords

  # Vaultwarden /metrics — DEFERRED. Upstream vaultwarden (dani-garcia)
  # doesn't yet expose a stable Prometheus endpoint; ENABLE_METRICS env
  # var is not part of the documented config. We rely on the blackbox
  # probe of https://passwords.lan for liveness instead.

  # pki.lan host metrics + service metrics. Reaches 10.0.0.192 via pfSense
  # routing (cross-subnet). cn-pki's node-exporter is on host network; its
  # Traefik publishes /metrics on :8082; step-ca publishes /metrics on :9110
  # (the latter requires `metrics: {address: ":9110"}` in ca.json — see the
  # cn-pki docker-compose.yml comment).
  - job_name: pki-node
    scrape_interval: 30s
    static_configs:
      - targets: ["10.0.0.192:9100"]
        labels:
          host: pki

  - job_name: pki-traefik
    scrape_interval: 30s
    static_configs:
      - targets: ["10.0.0.192:8082"]
        labels:
          host: pki
          stack: cn-pki

  # pki-stepca DEFERRED — step-ca v0.30.2's metrics:{address} config block
  # is silently ignored (no listener inside the container, /metrics returns
  # 404 on the main port). Until upstream sorts this out (or we figure out
  # the right config shape), step-ca health is observed via the blackbox
  # ACME-directory probe `https://pki.lan:9000/acme/acme/directory` already
  # configured in blackbox-https.

  # SMART data for kaiser's disks via smartctl-exporter sidecar.
  - job_name: kaiser-smart
    scrape_interval: 60s
    static_configs:
      - targets: ["smartctl-exporter:9633"]
        labels:
          host: kaiser

  # pfSense (LAN gateway) — SNMP via direct LAN access.
  - job_name: pfsense-snmp
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [pfsense_v2]
    static_configs:
      - targets: ["10.1.0.1"]
        labels:
          host: pfsense
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116

  # raidnas (Synology DS418) — SNMP via direct LAN access. Same indirection
  # pattern as the VPS scrape: target = raidnas IP, __address__ rewritten
  # to the snmp-exporter sidecar. `auth` query parameter selects the
  # `raidnas_v2` block under `auths:` in config/snmp-exporter/snmp.yml.
  - job_name: raidnas-snmp
    metrics_path: /snmp
    params:
      module: [synology]
      auth: [raidnas_v2]
    static_configs:
      - targets: ["10.120.26.20"]
        labels:
          host: raidnas
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
