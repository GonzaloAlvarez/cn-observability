modules:
  # HTTPS endpoint backed by a step-ca-issued cert. Every LAN HTTPS service
  # in this homelab falls into this bucket (cn-home + cn-vaultwarden +
  # cn-ha-sidecar + cn-pki all serve step-ca leafs). LE wildcard certs live
  # on the tailnet side and aren't probed from kaiser.
  lan_https:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: "ip4"
      method: GET
      # Most LAN services return 200 on /; some return 302 (login redirect),
      # 401 (auth required), or 404 (no root handler). All four mean "service
      # is up." Only no-response or 5xx mean "down."
      valid_status_codes: [200, 201, 204, 301, 302, 304, 401, 403, 404]
      fail_if_not_ssl: true
      tls_config:
        ca_file: /etc/blackbox_exporter/root_ca.crt
        insecure_skip_verify: false

  # Plain HTTP. Used for the step-ca CA bootstrap URL and k3s LAN ingresses
  # (which expose plain HTTP — TLS is tailnet-side via traefik-lab).
  #
  # follow_redirects=false because a 302 is itself a valid "service is up"
  # signal (it's in valid_status_codes), and apps fronted by oauth2-proxy
  # (e.g. filemanager.k8s.lan) redirect unauthenticated requests to
  # https://auth.neptune.lan — a step-ca-fronted HTTPS endpoint that this
  # module's http transport has no tls_config to verify, so following the
  # redirect always fails with "x509: certificate signed by unknown
  # authority". Stopping at the first response is both correct (we're
  # probing the LAN ingress, not the OIDC chain) and unblocking.
  lan_http:
    prober: http
    timeout: 8s
    http:
      preferred_ip_protocol: "ip4"
      method: GET
      follow_redirects: false
      valid_status_codes: [200, 201, 204, 301, 302, 304, 401, 403, 404]

  # LAN DNS resolver probe (cn-dnsdhcpd Technitium on pki, 10.0.0.192:53).
  # Queries router.lan through the resolver's `lan` Forwarder zone, so a
  # green probe proves the WHOLE phase-1 chain: kaiser -> Technitium ->
  # pfSense Unbound (hidden lease registry). Feeds LanDnsDown in alerts.yml.
  dns_lan:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      preferred_ip_protocol: "ip4"
      query_name: router.lan
      query_type: A
      valid_rcodes: [NOERROR]
      validate_answer_rrs:
        fail_if_none_matches_regexp:
          - "10\\.0\\.0\\.1"
