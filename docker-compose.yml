services:
  # ── metrics ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.0
    ports:
      # Host port 9091, not 9090 — kaiser's PCP pmproxy.service binds 9090
      # on all interfaces and we can't share. Internal container port stays 9090.
      - "127.0.0.1:9091:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.external-url=https://prometheus.${LAN_DOMAIN}"
      - "--web.enable-remote-write-receiver"   # accept pushes from other Prometheuses
    volumes:
      - "./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
      - "prometheus_data:/prometheus"
    extra_hosts:
      # So `host.docker.internal` resolves to the docker bridge gateway and
      # we can scrape node-exporter which runs on host network.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=https://alertmanager.${LAN_DOMAIN}"
    volumes:
      - "./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"
      - "alertmanager_data:/alertmanager"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    network_mode: host                          # /proc, /sys, host interfaces
    pid: host
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      # Bind on all host interfaces (including the docker bridge gateway)
      # so the Prometheus container can scrape via `host.docker.internal:9100`.
      # External access on :9100 is blocked by UFW (only 22/53/80/443 are open).
      - "--web.listen-address=:9100"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped

  # ── logs ─────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    ports:
      - "127.0.0.1:3100:3100"
      # Second binding on kaiser's LAN IP so off-host promtails (cn-pki,
      # cn-vaultwarden in Slice 4, etc.) can push without going through
      # Traefik. UFW gates 3100/tcp to the pki+vault LAN supernets.
      - "${KAISER_IP}:3100:3100"
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - "./config/loki/loki.yml:/etc/loki/loki.yml:ro"
      - "loki_data:/loki"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.4.2
    command: [ "-config.file=/etc/promtail/promtail.yml" ]
    ports:
      # Syslog receiver for LAN appliances that can't run promtail
      # natively (e.g. raidnas via DSM Log Center). Bound to kaiser's
      # LAN IP only — listening on all interfaces would conflict with
      # the default-deny perimeter posture. UFW gates 1514/tcp to the
      # raidnas subnet 10.120.26.0/24.
      - "${KAISER_IP}:1514:1514/tcp"
    volumes:
      - "./config/promtail/promtail.yml:/etc/promtail/promtail.yml:ro"
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /run/systemd/journal:/run/systemd/journal:ro
    depends_on:
      - loki
    restart: unless-stopped

  # ── exporters ────────────────────────────────────────────────────────────
  # Blackbox synthetic probes — HTTP(S) + TLS expiry on every LAN endpoint.
  # The user's recent 9-day step-ca outage manifested as expired leaf certs
  # on passwords.lan and homeiot.lan, undetected until iOS rejected them.
  # CertExpired + BlackboxProbeFailed in config/prometheus/alerts.yml are the
  # specific signals that would have caught it.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - "./config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro"
      # Mount the step-ca root CA so HTTPS probes can verify *.lan + *.kaiser.lan
      # certs without insecure_skip_verify. setup.sh keeps certs/root_ca.crt fresh
      # by fetching http://pki.lan/cert/ca.crt on every run.
      - "./certs/root_ca.crt:/etc/blackbox_exporter/root_ca.crt:ro"
    restart: unless-stopped

  # SMART data for kaiser's disks (1× WDC HDD on /dev/sda + 1× Samsung NVMe
  # on /dev/nvme0n1). privileged + /dev mount give the exporter the access
  # smartctl needs to read SMART pages off the controllers. Listens on :9633.
  smartctl-exporter:
    image: quay.io/prometheuscommunity/smartctl-exporter:v0.13.0
    privileged: true
    user: root
    volumes:
      - /dev:/hostdev:ro
    command:
      - "--smartctl.path=/usr/sbin/smartctl"
      - "--smartctl.interval=120s"
      - "--web.listen-address=:9633"
    restart: unless-stopped

  # SNMP for raidnas — scraped directly off the LAN (no tailnet needed).
  # Mirrors the VPS snmp-exporter so kaiser's Grafana can render the same
  # storage dashboard as the VPS one.
  snmp-exporter:
    image: prom/snmp-exporter:v0.27.0
    command:
      - "--config.file=/etc/snmp_exporter/snmp.yml"
    volumes:
      # snmp.yml is rendered by setup.sh (envsubst bakes in the
      # community string — snmp_exporter doesn't honor ${VAR}).
      - "./config/snmp-exporter/snmp.yml:/etc/snmp_exporter/snmp.yml:ro"
    restart: unless-stopped

  # ── viz ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SERVER_ROOT_URL=https://grafana.${LAN_DOMAIN}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # ── OIDC against Authentik on auth.neptune.lan ──────────────────────
      # kaiser host is NOT tailnet-joined, so we use the LAN-side URL.
      # GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA points at the step-ca root cert
      # mounted below so Grafana's backchannel TLS to auth.neptune.lan is
      # trusted (LE wouldn't apply here — step-ca issues auth.neptune.lan).
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${AUTHENTIK_GRAFANA_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${AUTHENTIK_GRAFANA_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email groups
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://auth.neptune.lan/application/o/authorize/
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://auth.neptune.lan/application/o/token/
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://auth.neptune.lan/application/o/userinfo/
      - GF_AUTH_GENERIC_OAUTH_SIGNOUT_REDIRECT_URL=https://auth.neptune.lan/application/o/grafana/end-session/
      - GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS=observability
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=groups
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'observability') && 'Admin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=false
      - GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA=/etc/grafana/step-ca.crt
      # Existing local user `gonzalo` was created at Grafana first-boot with
      # email gonzaloab@gmail.com. Authentik returns the same email for the
      # akadmin OIDC identity, so without this flag Grafana errors with
      # "user already exists" instead of linking the OIDC identity to the
      # existing user.
      - GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=true
    volumes:
      - "./config/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "./certs/root_ca.crt:/etc/grafana/step-ca.crt:ro"
      - "grafana_data:/var/lib/grafana"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # ── container mgmt ───────────────────────────────────────────────────────
  # Builds /etc/ssl/certs/ca-bundle.crt as `system CA bundle + cn-pki root`
  # into the shared `portainer_ca_bundle` volume. Portainer below sets
  # SSL_CERT_FILE to it so Go's TLS stack trusts BOTH LE/Mozilla roots
  # (needed for portainer.io version checks etc.) AND step-ca leaves
  # (needed for the OIDC backchannel to auth.neptune.lan).
  portainer-init:
    image: portainer/portainer-ce:latest
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        cat /etc/ssl/certs/ca-certificates.crt /step-ca/root_ca.crt > /shared/ca-bundle.crt \
          && chmod 644 /shared/ca-bundle.crt \
          && echo "ca-bundle.crt: $$(wc -l < /shared/ca-bundle.crt) lines"
    volumes:
      - ./certs/root_ca.crt:/step-ca/root_ca.crt:ro
      - portainer_ca_bundle:/shared
    restart: "no"

  portainer:
    image: portainer/portainer-ce:latest
    depends_on:
      portainer-init:
        condition: service_completed_successfully
    environment:
      # Go's crypto/tls honors SSL_CERT_FILE (single file) before falling back
      # to the system trust store. Pointing at the merged bundle here keeps
      # ALL the usual Mozilla roots PLUS step-ca trustable.
      - SSL_CERT_FILE=/portainer-tls/ca-bundle.crt
    ports:
      - "127.0.0.1:9000:9000"
    command: [ "-H", "unix:///var/run/docker.sock" ]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      # Mount the bundle volume at a dedicated path so we don't overlay the
      # container's own /etc/ssl/certs directory (which would lose every
      # other cert installed in the image).
      - portainer_ca_bundle:/portainer-tls:ro
    restart: unless-stopped

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  grafana_data:
  portainer_data:
  portainer_ca_bundle:
