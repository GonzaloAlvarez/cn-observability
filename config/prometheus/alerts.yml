groups:
  - name: services
    rules:
      # Generic up==0 alarm — covers every scrape job (mirror of the VPS
      # alert in cn-root-docker/tailnet/prometheus/alerts.yml::PrometheusTargetDown).
      # The `job` label propagates so each Down target paths through the
      # email receiver as its own alert.
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Metrics scrape failing: {{ $labels.job }} ({{ $labels.instance }})"
          description: "Prometheus on kaiser has been unable to reach the metrics endpoint of job '{{ $labels.job }}' at {{ $labels.instance }} for more than 2 minutes. This means the metrics port is unreachable — the service itself may still be working. Check: (1) is the container/host up? (2) if the target is a hardcoded IP in prometheus.yml, has the container been recreated with a different address? (compare `docker inspect <container>` with the static_configs entry)."

      - alert: AlertmanagerDown
        # Alertmanager not reachable from Prometheus. Self-monitoring: if AM
        # itself is down, this rule can't deliver — but the failure shows up
        # on the synthetic-checks dashboard and in `up` queries.
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager on kaiser is down"
          description: "kaiser Alertmanager (job=alertmanager) hasn't been scrapeable for 2 minutes — no alerts will deliver until it's back."

      - alert: LokiIngestionStalled
        # Loki accepts pushes but isn't ingesting anything. Catches a stuck
        # ingester / a wedged write path. We expect >0 streams created per
        # minute on a healthy kaiser (docker container logs + journal).
        expr: rate(loki_distributor_lines_received_total[10m]) == 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Loki has not ingested any log lines in 15 minutes"
          description: "kaiser Loki distributor has received zero lines for 15m — promtail may be wedged or Loki's write path is broken."

  # Host-level alerts. This Prometheus scrapes several hosts (kaiser, neptune,
  # passwords, pki, …), so these rules are host-generic: the expr aggregates per
  # `host` label (dedup — a host with multiple node-exporters, e.g. neptune's
  # per-stack :9103/:9104, would otherwise fire one alert per exporter) and the
  # annotations name the actual host via {{ $labels.host }}. (`site=kaiser` on
  # every alert is just this Prometheus's origin, from global.external_labels —
  # not the subject host.)
  - name: host
    rules:
      - alert: HighCPU
        expr: (1 - avg by (host)(rate(node_cpu_seconds_total{mode="idle"}[5m]))) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} CPU usage is high"
          description: "CPU usage on {{ $labels.host }} has been above 90% for more than 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: HighMemory
        expr: max by (host)((1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} memory usage is high"
          description: "Memory usage on {{ $labels.host }} has been above 85% for more than 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: DiskSpaceLow
        expr: max by (host, mountpoint)((1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.host }} disk space is running low"
          description: "Disk usage on {{ $labels.mountpoint }} ({{ $labels.host }}) has been above 80% for more than 5 minutes (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: DiskSpaceCritical
        expr: max by (host, mountpoint)((1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100) > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.host }} disk almost full"
          description: "{{ $labels.mountpoint }} on {{ $labels.host }} is {{ $value | printf \"%.1f\" }}% full — services may fail."

      # SMART data via smartctl-exporter. kaiser has 1× WDC HDD (sda) + 1×
      # Samsung NVMe (nvme0n1); both are sampled. smartctl_device_smart_status
      # is 1 when the drive reports PASSED, 0 on FAILED.
      - alert: SmartFailingDrive
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SMART status FAILED: {{ $labels.device }} on kaiser"
          description: "{{ $labels.device }} ({{ $labels.model_name }}) is reporting SMART status FAILED — replace before it dies."

  # pki.lan host alerts — mirror the kaiser-host thresholds, scoped to the
  # pki-node instance (10.0.0.250:9100). Catches CPU/memory/disk-space issues
  # on the Pi 5 running cn-pki before step-ca starts misbehaving.
  - name: pki-host
    rules:
      - alert: PkiHighCPU
        expr: (1 - avg by (instance)(rate(node_cpu_seconds_total{instance="10.0.0.250:9100",mode="idle"}[5m]))) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pki.lan CPU usage is high"
          description: "CPU on pki.lan has been above 90% for 5m (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: PkiHighMemory
        expr: (1 - node_memory_MemAvailable_bytes{instance="10.0.0.250:9100"} / node_memory_MemTotal_bytes{instance="10.0.0.250:9100"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pki.lan memory usage is high"
          description: "Memory on pki.lan has been above 85% for 5m (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: PkiDiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{instance="10.0.0.250:9100",mountpoint="/"} / node_filesystem_size_bytes{instance="10.0.0.250:9100",mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "pki.lan disk space is running low"
          description: "/ on pki.lan is {{ $value | printf \"%.1f\" }}% full."

      - alert: PkiDiskSpaceCritical
        expr: (1 - node_filesystem_avail_bytes{instance="10.0.0.250:9100",mountpoint="/"} / node_filesystem_size_bytes{instance="10.0.0.250:9100",mountpoint="/"}) * 100 > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "pki.lan disk almost full"
          description: "/ on pki.lan is {{ $value | printf \"%.1f\" }}% full — step-ca will start failing soon."

  # passwords.lan host alerts — mirror the kaiser-host thresholds, scoped to
  # the passwords-node instance (10.120.22.10:9100, the LAN-side dual exporter).
  - name: passwords-host
    rules:
      - alert: PasswordsHighCPU
        expr: (1 - avg by (instance)(rate(node_cpu_seconds_total{instance="10.120.22.10:9100",mode="idle"}[5m]))) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "passwords.lan CPU usage is high"
          description: "CPU on passwords.lan has been above 90% for 5m (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: PasswordsHighMemory
        expr: (1 - node_memory_MemAvailable_bytes{instance="10.120.22.10:9100"} / node_memory_MemTotal_bytes{instance="10.120.22.10:9100"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "passwords.lan memory usage is high"
          description: "Memory on passwords.lan has been above 85% for 5m (current: {{ $value | printf \"%.1f\" }}%)."

      - alert: PasswordsDiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes{instance="10.120.22.10:9100",mountpoint="/"} / node_filesystem_size_bytes{instance="10.120.22.10:9100",mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "passwords.lan disk space is running low"
          description: "/ on passwords.lan is {{ $value | printf \"%.1f\" }}% full."

      - alert: PasswordsDiskSpaceCritical
        expr: (1 - node_filesystem_avail_bytes{instance="10.120.22.10:9100",mountpoint="/"} / node_filesystem_size_bytes{instance="10.120.22.10:9100",mountpoint="/"}) * 100 > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "passwords.lan disk almost full"
          description: "/ on passwords.lan is {{ $value | printf \"%.1f\" }}% full — Vaultwarden will start failing soon."

  # printer.lan (cn-printer / amun-printer). Two concerns: the Pi's power
  # (the 2026 reboot investigation found 16 under-voltage events across the
  # recorded boots, two abrupt deaths right after CPU bursts and one 3.5-week
  # outage — a marginal 5 V supply with a bus-powered SSD) and the print
  # queue (a stopped printer or a stuck job used to go unnoticed for weeks).
  # rpi_* metrics come from amun-printer's rpi-throttled.sh textfile; cups_*
  # and printer_* from cn-printer's cups-exporter. The generic `host` group
  # covers CPU/memory/disk via host="printer".
  - name: printer
    rules:
      - alert: PiUndervoltage
        expr: rpi_undervoltage_now{host="printer"} == 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "printer.lan under-voltage right now"
          description: "The Pi's SoC reports the 5 V rail below 4.63 V (vcgencmd get_throttled bit 0). This is the brownout pattern that reset plane.lan. Check the PSU (official 5.1 V/3 A), the USB-C cable, and move the SSD to a powered hub."

      - alert: PiUndervoltageSinceBoot
        expr: rpi_undervoltage_occurred{host="printer"} == 1
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "printer.lan saw under-voltage since boot"
          description: "get_throttled bit 16 is set: at least one under-voltage dip since the last boot. Not actionable alone; if it recurs after the PSU/hub fix the supply is still marginal."

      - alert: PiThrottled
        expr: rpi_throttled_now{host="printer"} == 1 or rpi_soft_temp_limit_now{host="printer"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "printer.lan is throttled"
          description: "The SoC is throttling (power or temperature; bits 2/3 of get_throttled). Current temperature: rpi_soc_temp_celsius on the Printer host overview."

      - alert: PiThrottleMetricsStale
        expr: time() - rpi_throttled_last_update_seconds{host="printer"} > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "printer.lan throttle metrics are stale"
          description: "rpi.prom has not been rewritten for 10 minutes — the /etc/cron.d/rpi-throttled job or node-exporter-lan's textfile collector is broken (amun printer re-installs both)."

      - alert: CupsExporterDown
        expr: up{job="printer-cups"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "cups-exporter on printer.lan unreachable"
          description: "kaiser Prometheus cannot scrape 10.2.0.30:9329 for 10 minutes. Check 'docker compose ps cups-exporter' in ~/cn-printer and the ufw hole from 10.1.1.140."

      - alert: CupsDown
        expr: cups_up{host="printer"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "cupsd on printer.lan is not answering"
          description: "The cups-exporter is up but cupsd on :631 does not answer. Nothing prints. Check 'docker compose logs cups' in ~/cn-printer."

      - alert: PrinterQueueMissing
        expr: cups_up{host="printer"} == 1 and absent(cups_printer_state{host="printer",printer="Brother_MFC-L2750DW"})
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "printer.lan has no Brother queue"
          description: "cupsd is up but the Brother_MFC-L2750DW queue does not exist for 15 minutes — the printer did not answer IPP at start (off? USB unplugged? ipp-usb down?). The cups container retries every 60 s; check 'docker compose logs cups' and 'systemctl status ipp-usb' on the host."

      - alert: PrinterStopped
        expr: cups_printer_state{host="printer"} == 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Queue {{ $labels.printer }} is stopped"
          description: "CUPS marked the queue stopped (printer-state 5) for 5 minutes — usually a backend error after the printer went away. 'docker compose exec cups cupsenable {{ $labels.printer }}' once the printer is back."

      - alert: PrinterNeedsAttention
        expr: cups_printer_state_reason{host="printer",reason=~"(media-empty|media-jam|toner-empty|marker-supply-empty|cover-open|door-open|input-tray-missing|offline).*"} == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Printer needs attention: {{ $labels.reason }}"
          description: "{{ $labels.printer }} reports {{ $labels.reason }} for 5 minutes (paper, jam, toner, cover or offline)."

      - alert: PrinterTonerLow
        expr: min by (printer, marker) (printer_marker_level_percent{host="printer"}) < 10
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "Toner/drum low on {{ $labels.printer }}: {{ $labels.marker }}"
          description: "{{ $labels.marker }} is at {{ $value | printf \"%.0f\" }}%. Order a TN-760/DR-730 before it stops printing."

      - alert: PrintQueueStuck
        expr: cups_jobs{host="printer",state="pending"} > 0 and cups_job_oldest_pending_age_seconds{host="printer"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Print jobs stuck on {{ $labels.printer }}"
          description: "A job has been pending for more than 15 minutes on {{ $labels.printer }}. This used to mean 'PDF fails on the printer'; with the raster-only queue it means the printer is off, out of paper or ipp-usb lost the device. 'docker compose exec cups lpstat -o' and 'journalctl -u ipp-usb' on the host."

  # Synthetic probes — every LAN endpoint blackbox-exporter watches.
  #
  # Note on cert-expiry thresholds: step-ca issues 7-day (168h) leaf certs
  # and Traefik renews on its own schedule, so cert_remaining oscillates
  # somewhere between ~0h and ~168h on healthy targets. A static "<7d / <14d"
  # warning would fire constantly — instead, CertRenewalStalled detects the
  # renewal pipeline going quiet (probe_ssl_earliest_cert_expiry hasn't
  # changed value in 6 days = ~24h before any 7d leaf would expire). That
  # gives a 24h actionable warning window. CertExpired remains as the
  # post-expiry backstop and BlackboxProbeFailed catches the cascading
  # effect. Was 25h when leaves were 24h — bumped to 6d on 2026-06-23 when
  # step-ca's ACME provisioner duration was raised to 168h, prompted by the
  # one-failed-renewal-cycle-is-fatal lesson learned that day.
  - name: synthetic
    rules:
      # LAN resolver down (cn-dnsdhcpd Technitium on pki). Faster and more
      # specific than the generic BlackboxProbeFailed (which also fires at
      # 5m) because once DHCP option 6 points clients here, this outage
      # takes the whole LAN's name resolution with it.
      - alert: LanDnsDown
        expr: probe_success{job="blackbox-dns"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "LAN DNS resolver down: {{ $labels.instance }}"
          description: "Technitium on pki (cn-dnsdhcpd) has failed the router.lan resolution probe for 3 minutes. LAN clients pointed at 10.0.0.250 have no DNS. Rollback: pfSense DHCP option 6 back to blank (per-VLAN), or fix the stack: ssh pki.lan 'cd ~/cn-dnsdhcpd && docker compose ps'."

      # LAN resolver answering but slow — early smoke before users notice.
      - alert: LanDnsHighLatency
        expr: probe_duration_seconds{job="blackbox-dns"} > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LAN DNS slow: {{ $labels.instance }}"
          description: "router.lan lookups through Technitium have taken >500ms for 10 minutes. Check pki load and 'docker stats' for the technitium container."

      # App-metrics pipeline dead (json_exporter or Technitium API). DNS may
      # still be serving — LanDnsDown covers actual resolution.
      - alert: TechnitiumMetricsDown
        expr: up{job="dnsdhcpd-technitium"} == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Technitium metrics scrape down"
          description: "kaiser Prometheus cannot scrape the cn-dnsdhcpd json_exporter on 10.0.0.250:7979 for 10 minutes. Check 'docker compose ps metrics-exporter' on pki and the API token file."

      # Resolution errors climbing — upstream trouble or a broken zone.
      - alert: LanDnsServfailSpike
        expr: rate(technitium_servfail_total[10m]) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LAN DNS SERVFAIL spike on pki"
          description: "Technitium is returning >1 SERVFAIL/s over 10 minutes. Check upstream reachability (recursion) and the Query Logs app at https://dns.pki.lan."

      - alert: BlackboxProbeFailed
        expr: probe_success == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Probe failed: {{ $labels.instance }}"
          description: "Blackbox probe to {{ $labels.instance }} (job: {{ $labels.job }}) has been failing for more than 5 minutes."

      - alert: CertExpired
        expr: probe_ssl_earliest_cert_expiry > 0 and probe_ssl_earliest_cert_expiry - time() <= 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TLS cert EXPIRED: {{ $labels.instance }}"
          description: "TLS certificate for {{ $labels.instance }} is past its NotAfter — clients will refuse the handshake."

      # Early-warning for the failure mode that took down every *.kaiser.lan
      # service on 2026-06-22: traefik-lan's ACME renewal silently failed
      # and nothing fired until CertExpired caught it post-expiry. step-ca
      # leaves should turn over inside any 6d window (we issue 7d leaves;
      # traefik renews well before then). `changes() == 0` over 6d means
      # traefik has stopped issuing new leaves for that target. Pair with
      # `probe_success > 0` so a probe outage (which sets cert_expiry to 0,
      # also "no changes") doesn't double-fire on top of BlackboxProbeFailed.
      - alert: CertRenewalStalled
        expr: changes(probe_ssl_earliest_cert_expiry{job=~"blackbox-https"}[6d]) == 0 and probe_ssl_earliest_cert_expiry > 0 and probe_success == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TLS cert renewal stalled: {{ $labels.instance }}"
          description: "{{ $labels.instance }}'s leaf cert has not been re-issued in 6 days. step-ca renewal pipeline is likely broken; the 7d leaf will expire and start tripping CertExpired / BlackboxProbeFailed within ~24h."
